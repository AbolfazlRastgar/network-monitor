version: '3.8'

services:
  exporter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "9116:9116"
    volumes:
      - ./example-config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m network_exporter.main -c /app/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9116/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
