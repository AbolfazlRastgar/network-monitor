[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-exporter"
version = "1.0.0"
description = "Network monitoring exporter for Prometheus (ICMP ping + TCP checks)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Your Name"}]
license = {text = "MIT"}

dependencies = [
    "pyyaml>=6.0",
    "icmplib>=3.0.0",
    "prometheus-client>=0.16.0",
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
network-exporter = "network_exporter.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["network_exporter*"]
